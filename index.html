<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="경영평가">
<title>CL 경영평가 계산기</title>
<style>
:root{
  --bg:#f3f6fb;--card:#ffffff;--ink:#1b2533;--sub:#000000;--line:#e3e8f0;
  --accent:#2f6fd6;--accent-soft:#e8f0fd;--good:#1f9d6b;--good-soft:#e5f6ee;
  --warn:#c98100;--warn-soft:#fdf3e1;--bad:#d64545;--bad-soft:#fdeaea;
  --bonus:#7a55d3;--bonus-soft:#f0ebfc;--hero:#1a4799;--shadow:0 1px 3px rgba(20,40,80,.06),0 4px 14px rgba(20,40,80,.05);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e131a;--card:#18202b;--ink:#e7edf5;--sub:#ffffff;--line:#2a3542;
  --accent:#6aa3ff;--accent-soft:#1c2b42;--good:#4cc995;--good-soft:#16302a;
  --warn:#f0b04a;--warn-soft:#352a14;--bad:#ff7a7a;--bad-soft:#3a1d1f;
  --bonus:#b79bff;--bonus-soft:#29203f;--hero:#163a7c;--shadow:none;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.45;font-weight:400}
b,strong,h1,h2,h3,th{font-weight:700}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
/* top score bar */
.top{position:relative;z-index:20;background:var(--hero);color:#fff;
  padding:calc(8px + env(safe-area-inset-top)) 16px 9px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:14px;line-height:1.2;font-weight:600;opacity:.85;letter-spacing:-.2px}
.total{font-size:35px;font-weight:800;letter-spacing:-1px;line-height:1}
.total small{font-size:15px;font-weight:600;opacity:.8;margin-left:2px}
.split{text-align:right;font-size:13.5px;line-height:1.3;opacity:.95}
.split b{font-weight:700}
.miss-pill{display:inline-block;margin-top:3px;font-size:10.5px;background:rgba(255,255,255,.18);
  padding:2px 8px;border-radius:99px}
.catbar{display:flex;gap:5px;margin-top:6px;overflow-x:auto;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.cat{flex:1 1 0;min-width:0;white-space:nowrap;background:rgba(255,255,255,.14);border-radius:10px;padding:3px 6px;font-size:10.5px;line-height:1.25;letter-spacing:-.3px;text-align:center}
.cat b{display:block;line-height:1.2;font-size:13px;font-variant-numeric:tabular-nums}
.cat b span{font-size:10.5px}
/* layout */
main{max-width:640px;margin:0 auto;padding:14px 14px 0}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{margin:0 0 4px;font-size:18px}
.card h3{margin:0;font-size:17px;letter-spacing:-.3px}
.desc{margin:0 0 10px;color:var(--sub);font-size:15px}
.item header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px}
.item header h3{flex:1 1 auto}
.item header .chips{flex:0 0 auto;margin-left:auto}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12px;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;font-weight:600}
.chip.bonus{background:var(--bonus-soft);color:var(--bonus)}
.chip.ghost{background:transparent;border:1px solid var(--line);color:var(--sub);font-weight:500;font-size:13px}
.formula{margin:6px 0 10px;font-size:14.5px;color:var(--sub);background:var(--bg);border-radius:8px;padding:7px 9px}
.linked{margin:0 0 8px;font-size:14px;color:var(--sub)}
.linked span{display:inline-block;margin:2px 6px 2px 0;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.fld{display:flex;flex-direction:column;gap:1px;min-width:0}
.fld.wide{grid-column:1/-1}
.fl{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:0 8px;transition:border-color .15s}
.inp:focus-within{border-color:var(--accent);background:var(--card)}
.inp input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-size:14px;line-height:1.2;padding:3px 0;height:26px;outline:none;font-family:inherit;-webkit-appearance:none;appearance:none}
.inp em{font-style:normal;color:var(--sub);font-size:14.5px;margin-left:4px;white-space:nowrap}
.fld small{color:var(--sub);font-size:13px;line-height:1.25}
.result{margin-top:12px;border-radius:12px;padding:11px 12px;background:var(--good-soft)}
.result.wait{background:var(--bg);color:var(--sub);font-size:15px}
.scores{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.sc b{font-size:25px;font-weight:800;color:var(--good);letter-spacing:-.5px}
.sc span{color:var(--sub);font-size:15px;margin-left:3px}
.sc.bonus b{color:var(--bonus)}
.info{font-size:14px;margin-top:3px}
#res-lead{padding:4px 10px;margin-top:8px}
#res-lead .sc b{font-size:17px}
#res-lead .sc span{font-size:12.5px}
.note{font-size:13px;color:var(--warn);margin-top:3px}
.next{margin-top:7px;font-size:13.5px;background:var(--card);border-radius:8px;padding:6px 9px;color:var(--ink)}
.next b{color:var(--accent)}
details{margin-top:9px;font-size:14.5px;color:var(--sub)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details p{margin:6px 0 0;line-height:1.6}
/* score table */
.tbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.tbl th{background:var(--bg);color:var(--sub);font-weight:600;padding:6px 2px;font-size:13px;text-align:center}
.tbl th.l{text-align:left;padding-left:8px}
.tbl td{padding:6px 2px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td:first-child{padding-left:8px}
.tbl td small{display:block;color:var(--sub);font-size:12px;font-weight:500}
.tbl td.n{text-align:center;white-space:nowrap;border-left:1px solid var(--line)}
.tbl th:not(.l){border-left:1px solid var(--line)}
.tbl col.c-n{width:34px}.tbl col.c-my{width:52px}
.tbl tr.catrow td{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.tbl tr.sub td{font-weight:700;background:var(--bg)}
.tbl tr.tot td{font-weight:800;font-size:14.5px;border-bottom:0;border-top:2px solid var(--ink)}
.tbl tr.it{cursor:pointer}
.tbl tr.it:active td{background:var(--accent-soft)}
.my b{color:var(--good);font-size:14px}
.tbl tr.tot .my b{color:var(--accent);font-size:16px}
.my .bn{display:block;color:var(--bonus);font-size:12px;font-weight:700}
.my .na{color:var(--sub);font-size:12.5px}
.my .dd{color:var(--bad);font-weight:700}
/* analysis */
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:10px;font-size:15px}
.row:last-child{border-bottom:0}
.row.cr{padding:3px 0;line-height:1.2;border-bottom:0}
.row.cr b{font-weight:400}
.row.cr .r{font-weight:400}
.row.cr .bar{margin-top:2px;height:5px}
.row.mr{font-size:14px;padding:4px 0;line-height:1.3}
.row .r{text-align:right;white-space:nowrap}
.bar{height:7px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.lv{padding:10px 0;border-bottom:1px solid var(--line)}
.lv:last-child{border-bottom:0}
.lv .t{font-weight:700;font-size:14px}
.lv .d{font-size:13.5px;color:var(--sub);margin-top:2px}
.lv .g{float:right;font-weight:800;font-size:15px;color:var(--good)}
.rec .desc{font-size:13px}
.rec .tag{font-size:11px}
.rec .empty{font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:700;margin-right:4px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--sub);font-size:15px;padding:6px 0}
/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  background:color-mix(in srgb,var(--card) 90%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);
  border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(20,40,80,.06);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-width:0;border:0;background:transparent;color:var(--sub);font-family:inherit;font-size:12.5px;font-weight:600;
  padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:color .2s}
nav .ic{width:44px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;transition:background-color .2s}
nav .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav .lb{line-height:1.15;white-space:nowrap;letter-spacing:-.2px}
nav .pt{min-height:12px;line-height:12px;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--sub)}
nav button.on{color:var(--accent)}
nav button.on .ic{background:var(--accent-soft)}
nav button.on .ic svg{stroke-width:2}
nav button.on .lb{font-weight:800}
nav button.on .pt{color:var(--accent);opacity:1}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
@media (prefers-reduced-motion:reduce){nav button,nav .ic{transition:none}}
@media (max-width:360px){.grid{grid-template-columns:1fr}.total{font-size:31px}}
@media print{.top,nav{position:static}.panel{display:block}nav,.btns{display:none}body{padding:0}}
</style>
</head>
<body>

<div class="top">
  <div class="top-row">
    <div>
      <h1 id="ttl">2026 CL 경영평가 · 지국팀</h1>
      <div class="total" id="tTotal">0<small>점</small></div>
      <span class="miss-pill" id="tMiss">미입력 항목 확인 중</span>
    </div>
    <div class="split">
      기본 <b id="tBase">0</b> / 100<br>
      가점 <b id="tBonus">+0</b> / 19.5<br>
      감점 <b id="tDed">-0</b>
    </div>
  </div>
  <div class="catbar" id="catbar"></div>
</div>

<main id="main"></main>
<nav id="nav"></nav>

<script>
/*CALC_START*/
const EPS = 1e-9;
function vv(s,k){const x=s[k];if(x===null||x===undefined||x==='')return null;const n=Number(x);return isNaN(n)?null:n;}
function zz(s,k){const x=vv(s,k);return x===null?0:x;}
function geTable(x,t,fb){for(const [th,sc] of t){if(x>=th-EPS)return sc;}return fb;}
function ltTable(x,t,fb){for(const [th,sc] of t){if(x<th-EPS)return sc;}return fb;}
function avgPrev(a){const b=a.filter(x=>x!==null&&x>0);return b.length?b.reduce((p,c)=>p+c,0)/b.length:null;}
function clamp(x,a,b){return Math.min(Math.max(x,a),b);}
function rel(max,rank,N){if(rank===null||N===null)return null;if(N<=1)return max;const r=clamp(rank,1,N);return max*(N-r)/(N-1);}
function f2(x){if(x===null||x===undefined||isNaN(x))return '-';return (Math.round(x*100)/100).toLocaleString('ko-KR',{maximumFractionDigits:2});}
function f3(x){if(x===null||x===undefined||isNaN(x))return '-';return (Math.round(x*1000)/1000).toLocaleString('ko-KR',{maximumFractionDigits:3});}

const T = {
  nrHigh:[[1.5,3],[1.45,2.5],[1.4,2],[1.35,1.5],[1.3,1]],
  lump:[[500,2],[450,1.8],[400,1.6],[350,1.4],[300,1.2],[250,1.0],[200,0.8],[150,0.6],[100,0.4],[50,0.2]],
  ap:[[65,3],[60,2.5],[55,1.5],[45,1],[35,0.5]],
  ow:[[68,12],[67,11],[66,10],[65,9],[64,8],[63,7],[61,6],[59,5],[57,4],[55,3],[53,2],[51,1.5],[49,1],[47,0.5]],
  owHigh:[[74,3],[72,2],[70,1]],
  owImpr:[[120,4],[110,3.5],[105,3],[100,2.5],[90,2],[70,1.5]],
  fl:[[80,3],[75,2],[70,1.5],[65,1]],
  gr:[[45,7],[40,6.5],[35,6],[30,5.5],[25,5],[20,4.5],[15,4],[10,3.5],[5,3],[0,2.5],[-5,2],[-10,1.5],[-15,1]],
  grHigh:[[0.8,3.5],[0.75,3],[0.7,2.5],[0.65,2],[0.6,1.5]],
  sm:[[55,4],[52,3.5],[50,3],[48,2.5],[46,2.1],[44,1.9],[42,1.6],[40,1.3],[35,1.0],[30,0.8],[25,0.6],[20,0.4],[15,0.2]],
  pc:[[70,2],[65,1.5],[60,1],[55,0.5]],
  cancel:[[0.15,5],[0.17,4.5],[0.19,4],[0.21,3.5],[0.23,3],[0.25,2.5],[0.27,2],[0.29,1.5],[0.31,1],[0.33,0.5]],
  net:[[45,5],[40,4.5],[35,4],[30,3.5],[25,3],[20,2.5],[15,2],[10,1.5],[5,1],[0,0.5]],
  mb:[[55,5],[50,4.5],[45,4],[40,3.5],[35,3],[30,2.5],[25,2],[20,1.5],[15,1],[10,0.5]]
};

const ITEMS = [
 {id:'nrCount',cat:'신규렌탈',name:'신규렌탈 건수',baseMax:10,bonusMax:0,method:'상대평가',rel:true,rankKey:'rkNrCount',
  formula:'당월 신규렌탈 순주문 − 14일 이내 반환',rule:'배점 × (전체조직수 − 순위) ÷ (전체조직수 − 1). 리버스 시너지 제외.'},
 {id:'nrRate',cat:'신규렌탈',name:'신규렌탈 생산율',baseMax:24,bonusMax:0,method:'상대평가',rel:true,rankKey:'rkNrRate',
  formula:'(순주문 − 14일 반환) ÷ 렌탈관리계정 × 100',rule:'배점 × (전체조직수 − 순위) ÷ (전체조직수 − 1)'},
 {id:'nrImpr',cat:'신규렌탈',name:'신규렌탈 생산율 개선율',baseMax:6,bonusMax:3,method:'절대평가',
  formula:'당월 생산율 ÷ 직전3개월 평균 생산율 × 100',
  rule:'기본: 150% 이상 6점 · 70~150% 미만 4점×개선율 · 70% 미만 1점<br>高생산율 가점(당월 생산율): 1.500↑ 3 · 1.450↑ 2.5 · 1.400↑ 2 · 1.350↑ 1.5 · 1.300↑ 1<br>직전3개월 중 실적 있는 달만 평균, 모두 0이면 상위조직 개선율 적용'},
 {id:'lumpsum',cat:'신규렌탈',name:'일시불 매출금액',baseMax:0,bonusMax:2,method:'절대평가',
  formula:'지국팀은 소속 지국 점수 적용 (순주문 금액 − 14일 내 반환, 안마의자만)',
  rule:'500만↑ 2.0 · 450만↑ 1.8 · 400만↑ 1.6 · 350만↑ 1.4 · 300만↑ 1.2 · 250만↑ 1.0 · 200만↑ 0.8 · 150만↑ 0.6 · 100만↑ 0.4 · 50만↑ 0.2 · 50만 미만 0.1 · 0원 이하 0'},
 {id:'rrOther',cat:'재렌탈',name:'소유권 외 재렌탈 건수',baseMax:3,bonusMax:0,method:'상대평가',rel:true,rankKey:'rkRrOther',
  formula:'당월 소유권 외 재렌탈 순주문 − 14일 이내 반환',rule:'배점 × (전체조직수 − 순위) ÷ (전체조직수 − 1)'},
 {id:'apRate',cat:'재렌탈',name:'청정기 소유권 재렌탈 유입률',baseMax:3,bonusMax:0,method:'절대평가',
  formula:'청정기 소유권 재렌탈 유입 ÷ 청정기 소유권 도래(자가관리 제외) × 100',
  rule:'65%↑ 3 · 60%↑ 2.5 · 55%↑ 1.5 · 45%↑ 1 · 35%↑ 0.5 · 35% 미만 0<br>도래 3건 미만이면 상위조직 유입률 적용'},
 {id:'owRate',cat:'재렌탈',name:'소유권 재렌탈 유입률',baseMax:12,bonusMax:3,method:'절대평가',
  formula:'소유권 재렌탈 유입 ÷ 소유권 도래(자가관리·전기레인지 제외) × 100',
  rule:'68%↑ 12 · 67↑ 11 · 66↑ 10 · 65↑ 9 · 64↑ 8 · 63↑ 7 · 61↑ 6 · 59↑ 5 · 57↑ 4 · 55↑ 3 · 53↑ 2 · 51↑ 1.5 · 49↑ 1 · 47↑ 0.5 · 47% 미만 0<br>고유입률 가점: 70%↑ +1 · 72%↑ +2 · 74%↑ +3'},
 {id:'owImpr',cat:'재렌탈',name:'소유권 재렌탈 유입률 개선율',baseMax:4,bonusMax:0,method:'절대평가',
  formula:'당월 유입률 ÷ 직전3개월 평균 유입률 × 100',
  rule:'120%↑ 4 · 110↑ 3.5 · 105↑ 3 · 100↑ 2.5 · 90↑ 2 · 70↑ 1.5 · 70% 미만 1'},
 {id:'stCount',cat:'전략',name:'전략제품 판매건수',baseMax:4,bonusMax:0,method:'상대평가',rel:true,rankKey:'rkSt',
  formula:'전략제품 순주문 − 14일 반환 (렌탈만, 환산건수)',
  rule:'배점 × (전체조직수 − 순위) ÷ (전체조직수 − 1) · 판매 0건 이하 0점<br>환산(신규/재렌탈): 의료기기·음식물처리기·웨어러블(단기) 1.0/0.5 · 침대·스마트매트리스·안마의자·BEREX R/M 1.5/0.5 · 에어컨·웨어러블(5년)·BEREX 의료기기 2.0/0.5'},
 {id:'fl',cat:'전략',name:'금융리스 판매 비중',baseMax:3,bonusMax:0,method:'절대평가',
  formula:'금융리스 환산 ÷ 렌탈 순주문 × 100',
  rule:'80%↑ 3 · 75↑ 2 · 70↑ 1.5 · 65↑ 1 · 65% 미만 0<br>환경가전 3년 0건 · 5년 0.7건 · 6년↑ 1건 / 환경가전 외 5년↑ 1건'},
 {id:'gr',cat:'전략',name:'정수기·청정기·비데 신규렌탈 성장률',baseMax:7,bonusMax:3.5,method:'절대평가',

const META = Object.fromEntries(ITEMS.map(m=>[m.id,m]));
const CATS = [

function compute(s){
  const g=k=>vv(s,k), z=k=>zz(s,k);
  const N=g('orgN'), acc=g('accounts');
  const I={};
  const put=(id,o)=>{I[id]=Object.assign({base:null,bonus:null,info:'',note:''},o);};

  // 신규렌탈
  const nrO=g('nrOrders'); const nrNet=nrO===null?null:nrO-z('nrReturns');
  const nrRate=(nrNet!==null&&acc)?nrNet/acc*100:null;
  put('nrCount',{base:rel(10,g('rkNrCount'),N),bonus:0,info:nrNet!==null?`순실적 ${f2(nrNet)}건`:''});
  put('nrRate',{base:rel(24,g('rkNrRate'),N),bonus:0,info:nrRate!==null?`생산율 ${f3(nrRate)}%`:''});
  { let impr=null,note='';
    if(nrRate!==null){const avg=avgPrev([g('nrP1'),g('nrP2'),g('nrP3')]);
      if(avg!==null){impr=nrRate/avg*100;note='';}
      else{impr=g('nrUpperImpr');note='직전3개월 실적 없음 → 상위조직 개선율 적용';}}
    const base=impr===null?null:(impr>=150-EPS?6:impr>=70-EPS?4*impr/100:1);
    const bonus=nrRate===null?null:geTable(nrRate,T.nrHigh,0);
    put('nrImpr',{base,bonus,info:impr!==null?`개선율 ${f2(impr)}% · 당월 생산율 ${f3(nrRate)}%`:'',note});}
  { const a=g('lumpsum'); let b=null;
    if(a!==null){b=a<=0?0:(a<50-EPS?0.1:geTable(a,T.lump,0.1));}
    put('lumpsum',{base:0,bonus:b,info:a!==null?`지국 일시불 ${f2(a)}만원`:''});}

  // 재렌탈
  put('rrOther',{base:rel(3,g('rkRrOther'),N),bonus:0});
  { const i=g('apIn'),d=g('apDue'); let r=null,note='';
    if(i!==null&&d!==null){ if(d<3){r=g('apUpper');note='도래 3건 미만 → 상위조직 유입률 적용';} else r=i/d*100; }
    put('apRate',{base:r===null?null:geTable(r,T.ap,0),bonus:0,info:r!==null?`유입률 ${f2(r)}%`:'',note});}
  const owIn=g('owIn'),owDue=g('owDue');
  const owR=(owIn!==null&&owDue)?owIn/owDue*100:null;
  put('owRate',{base:owR===null?null:geTable(owR,T.ow,0),bonus:owR===null?null:geTable(owR,T.owHigh,0),
    info:owR!==null?`유입률 ${f2(owR)}%`:''});
  { let impr=null,note='';
    if(owR!==null){const avg=avgPrev([g('owP1'),g('owP2'),g('owP3')]);
      if(avg!==null)impr=owR/avg*100; else{impr=g('owUpperImpr');note='직전3개월 실적 없음 → 상위조직 개선율 적용';}}
    put('owImpr',{base:impr===null?null:geTable(impr,T.owImpr,1),bonus:0,info:impr!==null?`개선율 ${f2(impr)}%`:'',note});}

  // 전략
  { const keys=['stN1','stR1','stN15','stR15','stN2','stR2'];
    const any=keys.some(k=>g(k)!==null);
    const conv=z('stN1')*1+z('stN15')*1.5+z('stN2')*2+(z('stR1')+z('stR15')+z('stR2'))*0.5;
    let base=rel(4,g('rkSt'),N),note='';
    if(any&&conv<=0){base=0;note='판매 0건 이하 → 0점';}
    put('stCount',{base,bonus:0,info:any?`환산 판매 ${f2(conv)}건`:'',note});}
  { const tot=g('rentalOrders'); const any=['flEnv5','flEnv6','flOther'].some(k=>g(k)!==null);
    let r=null,conv=null;
    if(tot&&any){conv=z('flEnv5')*0.7+z('flEnv6')+z('flOther');r=conv/tot*100;}
    put('fl',{base:r===null?null:geTable(r,T.fl,0),bonus:0,info:r!==null?`금융리스 환산 ${f2(conv)}건 · 비중 ${f2(r)}%`:''});}
  { const cur=g('grCur'); let base=null,bonus=null,info='',note='';
    if(cur!==null){
      if(cur<=0){base=0;bonus=0;note='판매 0건 이하 → 0점';}
      else{
        const raw=avgPrev([g('grP1'),g('grP2'),g('grP3')]);
        const avg=raw===null?null:Math.round(raw);
        let gr=null;
        if(avg)gr=(cur-avg)/avg*100; else{gr=g('grUpper');note='직전3개월 실적 없음 → 상위조직 성장률 적용';}
        if(gr!==null){
          base=geTable(gr,T.gr,0);
          const hp=acc?cur/acc*100:null;
          const hb=hp===null?0:geTable(hp,T.grHigh,0);
          bonus=Math.max(0,Math.min(hb,7-base));
          if(hb>bonus+EPS)note=(note?note+' · ':'')+`高생산율 가점 ${f2(hb)}점 중 ${f2(bonus)}점만 반영(항목 최대 7점)`;
          info=`성장률 ${f2(gr)}%`+(avg?` (직전 평균 ${avg}건)`:'')+(hp!==null?` · 高생산율 ${f3(hp)}%`:'');
        }
      }
    }
    put('gr',{base,bonus,info,note});}
  { const i=g('smIn'),d=g('smDue'); let r=null,note='';
    if(i!==null&&d!==null){ if(d<5){r=g('smJiguk');note='도래 5건 미만 → 소속 지국 유입률 적용';} else r=i/d*100; }
    const sb=i===null?null:Math.min(2,Math.max(0,i)*0.2);
    put('smRate',{base:r===null?null:geTable(r,T.sm,0),bonus:sb,
      info:(r!==null?`유입률 ${f2(r)}%`:'')+(i!==null?` · 유입 ${f2(i)}건 × 0.2점 = 가점 ${f2(sb)}`:''),note});}
  { const d=g('dueAll'); const any=g('pcGeneral')!==null||g('pcSelf')!==null; let r=null;
    if(d&&any)r=(z('pcGeneral')+z('pcSelf')*1.5)/d*100;
    put('pc',{base:0,bonus:r===null?null:geTable(r,T.pc,0),info:r!==null?`유입률 ${f2(r)}%`:''});}

  // 관리
  { const ret=g('rentReturns'); let r=null;
    if(ret!==null&&acc)r=ret/acc*100;
    put('cancel',{base:r===null?null:ltTable(r,T.cancel,0),bonus:0,info:r!==null?`해약률 ${f3(r)}%`:''});}
  { const ro=g('rentalOrders'),d=g('dueAll'); let n=null;
    if(ro!==null&&d!==null)n=ro+z('smIn')*0.5-z('rentReturns')-d;
    put('net',{base:n===null?null:geTable(n,T.net,0),bonus:0,info:n!==null?`순증 ${f2(n)}건`:''});}
  { const d=g('mbDue'); const any=g('mbMem')!==null||g('mbOther')!==null; let r=null;
    if(d!==null&&any){const den=d-z('mbRerental');const num=z('mbMem')+z('mbOther')*0.5-z('mbQuit');r=den>0?num/den*100:null;}
    put('mb',{base:r===null?null:geTable(r,T.mb,0),bonus:0,info:r!==null?`유입률 ${f2(r)}%`:''});}

  // 조직
  { const b=g('orgBase'); put('org',{base:b===null?null:clamp(b,0,5),bonus:clamp(z('orgBonus'),0,1)});}
  put('lead',{base:0,bonus:clamp(z('leadBonus'),0,3)});
  const ded=Math.abs(z('dedHeart'))+Math.abs(z('ded5200'))+Math.abs(z('dedClaim'));

  let base=0,bonus=0,missing=[];
  const cat={}; CATS.forEach(c=>cat[c.k]={base:0,bonus:0});
  for(const m of ITEMS){
    const r=I[m.id];
    r.missing = m.baseMax ? r.base===null : r.bonus===null;
    if(r.missing){ if(!m.optional)missing.push(m.name); continue; }
    base+=r.base||0; bonus+=r.bonus||0;
    cat[m.cat].base+=r.base||0; cat[m.cat].bonus+=r.bonus||0;
  }
  return {items:I,base,bonus,ded,total:base+bonus-ded,missing,cat};
}

// 항목별 "다음 구간" 레버
function bump(s,k,d){const x=vv(s,k);s[k]=(x===null?0:x)+d;}
const ITEM_LEVER = {
  nrImpr:{f:(s,k)=>bump(s,'nrOrders',k),u:'신규렌탈'},
  apRate:{f:(s,k)=>bump(s,'apIn',k),u:'청정기 재렌탈'},
  owRate:{f:(s,k)=>bump(s,'owIn',k),u:'소유권 재렌탈'},
  owImpr:{f:(s,k)=>bump(s,'owIn',k),u:'소유권 재렌탈'},
  fl:{f:(s,k)=>{bump(s,'flEnv6',k);bump(s,'rentalOrders',k);},u:'6년 약정 판매'},
  gr:{f:(s,k)=>bump(s,'grCur',k),u:'정·청·비 신규'},
  smRate:{f:(s,k)=>bump(s,'smIn',k),u:'자가관리 재렌탈'},
  pc:{f:(s,k)=>bump(s,'pcGeneral',k),u:'사전계약 재렌탈'},
  cancel:{f:(s,k)=>bump(s,'rentReturns',-k),u:'해약',neg:'rentReturns'},
  net:{f:(s,k)=>bump(s,'rentalOrders',k),u:'렌탈 순주문'},
  mb:{f:(s,k)=>bump(s,'mbMem',k),u:'도래 멤버십 가입'}
};
function itemTotal(res,id){const r=res.items[id];return (r.base||0)+(r.bonus||0);}
function itemNext(s,id){
  const L=ITEM_LEVER[id]; if(!L)return null;
  const res=compute(s); if(res.items[id].missing)return null;
  const cur=itemTotal(res,id); const m=META[id];
  if(cur>=m.baseMax+m.bonusMax-EPS)return {max:true};
  const lim=L.neg?Math.floor(zz(s,L.neg)):300;
  for(let k=1;k<=lim;k++){
    const s2=Object.assign({},s); L.f(s2,k);
    const t=itemTotal(compute(s2),id);
    if(t>cur+1e-6)return {k,gain:t-cur,u:L.u,neg:!!L.neg};
  }
  return null;
}

// 종합 시뮬레이션 레버 (연관 항목 동시 반영)
const LEVERS = [
  {name:'정·청·비 신규렌탈 (6년 약정)',main:'grCur',inc:['grCur','nrOrders','rentalOrders','flEnv6'],d:1,
   eff:'성장률·생산율 개선율·금융리스·계정순증'},
  {name:'소유권 재렌탈 유입 (6년 약정)',main:'owIn',inc:['owIn','rentalOrders','mbRerental','flEnv6'],d:1,
   eff:'소유권 유입률·개선율·계정순증·멤버십'},
  {name:'청정기 소유권 재렌탈 (6년 약정)',main:'apIn',inc:['apIn','owIn','rentalOrders','mbRerental','flEnv6'],d:1,
   eff:'청정기 유입률·소유권 유입률·계정순증'},
  {name:'자가관리 소유권 재렌탈 (6년 약정)',main:'smIn',inc:['smIn','rentalOrders','mbRerental','flEnv6'],d:1,
   eff:'자가관리 유입률·유입건 가점·계정순증(1.5건)'},
  {name:'사전계약·청약 재렌탈 (6년 약정)',main:'pcGeneral',inc:['pcGeneral','owIn','rentalOrders','mbRerental','flEnv6'],d:1,
   eff:'사전계약 유입률·소유권 유입률·계정순증'},
  {name:'멤버십 가입 (도래 고객)',main:'mbMem',inc:['mbMem'],d:1,eff:'멤버십 유입률'},
  {name:'렌탈 해약 방어',main:'rentReturns',inc:['rentReturns'],d:-1,eff:'해약률·계정순증'}
];
function totalNoManual(res){return res.base+res.bonus;}
function simulate(s){
  const cur=totalNoManual(compute(s)); const out=[];
  for(const L of LEVERS){
    if(vv(s,L.main)===null)continue;
    const lim=L.d<0?Math.floor(vv(s,L.main)):60;
    let best=null;
    for(let k=1;k<=lim;k++){
      const s2=Object.assign({},s);
      for(const key of L.inc){ if(vv(s2,key)!==null) s2[key]=vv(s2,key)+L.d*k; }
      const t=totalNoManual(compute(s2));
      if(t>cur+1e-6){best={k,gain:t-cur};break;}
    }
    if(best){
      const s5=Object.assign({},s); const k5=Math.min(L.d<0?lim:5,lim);
      for(const key of L.inc){ if(vv(s5,key)!==null) s5[key]=vv(s5,key)+L.d*k5; }
      best.k5=k5; best.gain5=totalNoManual(compute(s5))-cur;
      out.push(Object.assign({},L,best,{eff2:best.gain/best.k}));
    }
  }
  return out.sort((a,b)=>b.eff2-a.eff2);
}

function renderItem(res,id){
  const el=document.getElementById('res-'+id); if(!el)return;
  const m=META[id], r=res.items[id];
  if(r.missing){const need=missingNeeds(id);el.className='result wait';
    el.innerHTML=`<b>점수 계산 대기</b>${need.length?`<br>필요한 값: ${need.join(', ')}`:''}${r.note?`<br><span style="color:var(--warn)">${r.note}</span>`:''}`;return;}
  el.className='result';
  let h='<div class="scores">';
  if(m.baseMax)h+=`<div class="sc"><b>${f2(r.base)}</b><span>/ ${m.baseMax}점</span></div>`;
  if(m.bonusMax)h+=`<div class="sc bonus"><b>+${f2(r.bonus)}</b><span>/ 가점 ${m.bonusMax}</span></div>`;
  h+='</div>';
  if(r.info)h+=`<div class="info">${r.info}</div>`;
  if(r.note)h+=`<div class="note">${r.note}</div>`;
  if(m.rel){
    const N=vv(state,'orgN');
    if(N&&N>1){const rk=vv(state,m.rankKey);
      h+=`<div class="next">순위 1단계 상승마다 <b>+${f2(m.baseMax/(N-1))}점</b>${rk>1?` · 1위 시 <b>+${f2(m.baseMax-r.base)}점</b>`:''}</div>`;}
  } else if(id==='lumpsum'){
    const a=vv(state,'lumpsum'); const steps=[50,100,150,200,250,300,350,400,450,500];
    const nx=a<=0?null:steps.find(t=>t>a+EPS);
    if(a<=0)h+=`<div class="next">매출 발생 시 <b>+0.1점</b>부터 시작</div>`;
    else if(nx)h+=`<div class="next">지국 매출 <b>+${f2(nx-a)}만원</b> → ${nx}만원 구간 <b>+${f2(geTable(nx,T.lump,0)-r.bonus)}점</b></div>`;
  } else {
    const n=itemNext(state,id);
    if(n&&n.max)h+=`<div class="next">✔ 이 항목 만점 달성</div>`;
    else if(n)h+=`<div class="next">${n.u} <b>${n.neg?'−':'+'}${n.k}건</b>${n.neg?' 줄이면':' 더 하면'} <b>+${f2(n.gain)}점</b></div>`;
  }
  el.innerHTML=h;
}

function renderAnalysis(res){
  const el=document.getElementById('analysis'); if(!el)return;
  let h=`<section class="card"><h2>카테고리별 달성</h2><p class="desc">${esc(state.month||'평가월 미입력')} · 기본점수 달성률</p>`;
  for(const c of CATS){
    const v=res.cat[c.k]; const pct=c.base?Math.min(100,v.base/c.base*100):0;
    h+=`<div class="row cr" style="display:block"><div style="display:flex;justify-content:space-between">
      <b>${c.k}</b><span class="r">${f2(v.base)} / ${c.base}${c.bonus?` <span style="color:var(--bonus)">+${f2(v.bonus)}</span>`:''}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }
  h+=`<div class="row"><b>최종 점수</b><span class="r"><b style="font-size:19px;color:var(--accent)">${f2(res.total)}점</b></span></div></section>`;

  const sims=simulate(state);
  h+=`<section class="card rec"><h2>점수 올리기 추천</h2><p class="desc">추가 실적 1건당 점수 효율 순. 연관 항목(순증·멤버십 모수·금융리스 비중)을 함께 반영했고, 판매는 6년 약정 기준입니다. 상대평가 순위 변동은 포함되지 않습니다.</p>`;
  if(!sims.length)h+=`<div class="empty">기초 데이터와 항목 실적을 입력하면 추천이 표시됩니다.</div>`;
  sims.slice(0,7).forEach((x,i)=>{
    h+=`<div class="lv"><span class="g">+${f2(x.gain)}점</span>
      <div class="t">${i<3?`<span class="tag">TOP ${i+1}</span>`:''}${x.name}</div>
      <div class="d">${x.d<0?'−':'+'}${x.k}건 시 +${f2(x.gain)}점 · ${x.d<0?'−':'+'}${x.k5}건 시 +${f2(x.gain5)}점</div>
      <div class="d">영향: ${x.eff}</div></div>`;
  });
  h+=`</section>`;

  const lost=ITEMS.filter(m=>m.baseMax&&!res.items[m.id].missing)
    .map(m=>({m,lost:m.baseMax-(res.items[m.id].base||0)})).filter(x=>x.lost>0.001).sort((a,b)=>b.lost-a.lost);
  h+=`<section class="card"><h2>놓친 기본점수</h2><p class="desc"${lost.length?'':' style="margin-bottom:0"'}>${lost.length?'배점 대비 부족한 점수가 큰 순서':'입력된 항목은 모두 만점이거나 아직 입력 전입니다.'}</p>`;
  lost.forEach(x=>{h+=`<div class="row"><span>${x.m.name}<br><small style="color:var(--sub);font-size:13px">${x.m.method} · ${x.m.cat}</small></span>
    <span class="r" style="color:var(--bad);font-weight:700">−${f2(x.lost)}</span></div>`;});
  h+=`</section>`;

  if(res.missing.length){
    h+=`<section class="card"><h2>미입력 항목 ${res.missing.length}개</h2><p class="desc">입력하지 않은 항목은 0점으로 합산되어 있습니다.</p>
    ${res.missing.map(n=>`<div class="row mr"><span>${n}</span></div>`).join('')}</section>`;
  }
  el.innerHTML=h;
}

function update(){
  const res=compute(state);
  document.getElementById('tTotal').innerHTML=`${f2(res.total)}<small>점</small>`;
  document.getElementById('tBase').textContent=f2(res.base);
  document.getElementById('tBonus').textContent='+'+f2(res.bonus);
  document.getElementById('tDed').textContent='-'+f2(res.ded);
  document.getElementById('tMiss').textContent=res.missing.length?`미입력 ${res.missing.length}개 항목 (0점 처리)`:'모든 항목 입력 완료';
  document.getElementById('ttl').textContent=`${state.month?state.month+' · ':''}CL 경영평가 · 지국팀`;
  document.getElementById('catbar').innerHTML=CATS.map(c=>{const v=res.cat[c.k];
    return `<div class="cat">${c.k}<b>${f2(v.base+v.bonus)}<span style="font-weight:500;opacity:.75"> /${c.base}</span></b></div>`;}).join('');
  for(const t of TABS){ if(!t.cat)continue; const el=document.getElementById('np-'+t.id);
    if(el){const c=res.cat[t.cat]; let v=c.base+c.bonus; if(t.id==='mg')v+=res.cat['조직'].base+res.cat['조직'].bonus; el.textContent=v>0?(Math.round(v*10)/10).toFixed(1):'';} }
  ITEMS.forEach(m=>renderItem(res,m.id));
  renderScoreTable(res);
  document.querySelectorAll('[data-link]').forEach(el=>{const k=el.dataset.link;const x=state[k];
    el.querySelector('b').textContent=(x===undefined||x==='')?'미입력':x+(FIELDS[k].unit||'');});
  renderAnalysis(res);
}
